name: Start or stop DEV worker

on:
  workflow_dispatch:
    inputs:
      action:
        description: Desired state
        required: true
        type: choice
        options: [start, stop]

permissions:
  contents: read
  id-token: write

concurrency:
  group: control-dev-worker
  cancel-in-progress: true

env:
  AZURE_CORE_OUTPUT: none
  RESOURCE_GROUP: ${{ vars.AZURE_DEV_RESOURCE_GROUP }}

jobs:
  control:
    name: ${{ inputs.action }} DEV worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev

    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Control DEV worker
        run: |
          if [ "${{ inputs.action }}" = "start" ]; then
            MIN_REPLICAS=1
            EXTRA_ARGUMENTS=(--set-env-vars "WorkerAutoStopToken=control-${{ github.run_id }}-${{ github.run_attempt }}")
          else
            MIN_REPLICAS=0
            EXTRA_ARGUMENTS=()
          fi

          az containerapp update \
            --name ca-assistant-worker-dev \
            --resource-group "$RESOURCE_GROUP" \
            "${EXTRA_ARGUMENTS[@]}" \
            --min-replicas "$MIN_REPLICAS"

  auto-stop-worker:
    name: Stop DEV worker after 30 minutes
    needs: control
    if: ${{ inputs.action == 'start' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: dev

    steps:
      - name: Wait before stopping worker
        run: sleep 1800

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Stop DEV worker
        run: |
          EXPECTED_TOKEN="control-${{ github.run_id }}-${{ github.run_attempt }}"
          CURRENT_TOKEN="$(az containerapp show \
            --name ca-assistant-worker-dev \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[?name == 'worker'] | [0].env[?name == 'WorkerAutoStopToken'].value | [0]" \
            --output tsv)"

          if [ "$CURRENT_TOKEN" != "$EXPECTED_TOKEN" ]; then
            echo "The DEV worker was restarted more recently; skipping this stale stop."
            exit 0
          fi

          az containerapp update \
            --name ca-assistant-worker-dev \
            --resource-group "$RESOURCE_GROUP" \
            --min-replicas 0
