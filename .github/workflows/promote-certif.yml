name: Promote release candidate to CERTIF

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Release candidate artifact to promote, for example rc-2026.09.1
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-certif
  cancel-in-progress: false

env:
  AZURE_CORE_OUTPUT: none
  DEV_RESOURCE_GROUP: ${{ vars.AZURE_DEV_RESOURCE_GROUP }}
  CERTIF_RESOURCE_GROUP: ${{ vars.AZURE_CERTIF_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}

jobs:
  promote:
    name: Promote release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: certif

    steps:
      - name: Validate release candidate name
        env:
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          if ! printf '%s' "$RELEASE_CANDIDATE" | grep -Eq '^rc-[0-9A-Za-z._-]+$'; then
            echo "release_candidate must start with rc-." >&2
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download release candidate manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          ARTIFACT_ID="$(gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${RELEASE_CANDIDATE}&per_page=100" \
            | jq -r '[.[].artifacts[] | select(.expired == false)] | sort_by(.created_at) | last.id // empty')"

          if [ -z "$ARTIFACT_ID" ]; then
            echo "No active artifact was found for ${RELEASE_CANDIDATE}." >&2
            exit 1
          fi

          mkdir -p /tmp/release-candidate
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/release-candidate/artifact.zip
          unzip -q /tmp/release-candidate/artifact.zip -d /tmp/release-candidate

          MANIFEST="/tmp/release-candidate/${RELEASE_CANDIDATE}.yml"
          if [ ! -f "$MANIFEST" ]; then
            echo "The release candidate manifest is missing from the artifact." >&2
            exit 1
          fi

          API_IMAGE="$(awk '$1 == "api:" {print $2}' "$MANIFEST")"
          WORKER_IMAGE="$(awk '$1 == "worker:" {print $2}' "$MANIFEST")"
          MIGRATIONS_IMAGE="$(awk '$1 == "migrations:" {print $2}' "$MANIFEST")"
          SPA_IMAGE="$(awk '$1 == "spa:" {print $2}' "$MANIFEST")"

          for image in "$API_IMAGE" "$WORKER_IMAGE" "$MIGRATIONS_IMAGE" "$SPA_IMAGE"; do
            if ! printf '%s' "$image" | grep -Eq "^${ACR_NAME}\\.azurecr\\.io/(assistant-api|assistant-worker|assistant-migrations|assistant-spa)@sha256:[0-9a-f]{64}$"; then
              echo "The release candidate contains an invalid immutable image reference." >&2
              exit 1
            fi
          done

          {
            echo "API_IMAGE=${API_IMAGE}"
            echo "WORKER_IMAGE=${WORKER_IMAGE}"
            echo "MIGRATIONS_IMAGE=${MIGRATIONS_IMAGE}"
            echo "SPA_IMAGE=${SPA_IMAGE}"
          } >> "$GITHUB_ENV"

      - name: Verify images and DEV provenance
        env:
          API_IMAGE: ${{ env.API_IMAGE }}
          WORKER_IMAGE: ${{ env.WORKER_IMAGE }}
          MIGRATIONS_IMAGE: ${{ env.MIGRATIONS_IMAGE }}
          SPA_IMAGE: ${{ env.SPA_IMAGE }}
        run: |
          for image in "$API_IMAGE" "$WORKER_IMAGE" "$MIGRATIONS_IMAGE" "$SPA_IMAGE"; do
            REPOSITORY="${image#${ACR_NAME}.azurecr.io/}"
            az acr repository show \
              --name "$ACR_NAME" \
              --image "$REPOSITORY" \
              --only-show-errors >/dev/null
          done

          DEV_API_IMAGE="$(az containerapp show \
            --name ca-assistant-api-dev \
            --resource-group "$DEV_RESOURCE_GROUP" \
            --query properties.template.containers[0].image --output tsv)"
          DEV_SPA_IMAGE="$(az containerapp show \
            --name ca-assistant-spa-dev \
            --resource-group "$DEV_RESOURCE_GROUP" \
            --query properties.template.containers[0].image --output tsv)"

          DEV_API_DIGEST="$(az acr repository show --name "$ACR_NAME" --image "${DEV_API_IMAGE#${ACR_NAME}.azurecr.io/}" --query digest --output tsv)"
          DEV_SPA_DIGEST="$(az acr repository show --name "$ACR_NAME" --image "${DEV_SPA_IMAGE#${ACR_NAME}.azurecr.io/}" --query digest --output tsv)"
          if [ "$DEV_API_DIGEST" != "${API_IMAGE##*@}" ] || [ "$DEV_SPA_DIGEST" != "${SPA_IMAGE##*@}" ]; then
            echo "The release candidate is not the API and SPA revision currently validated in DEV." >&2
            exit 1
          fi

      - name: Run CERTIF Flyway job
        run: |
          az containerapp job update \
            --name caj-assistant-migrations-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --image "$MIGRATIONS_IMAGE"

          EXECUTION_NAME="$(az containerapp job start \
            --name caj-assistant-migrations-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --query name --output tsv)"

          for attempt in $(seq 1 60); do
            STATUS="$(az containerapp job execution show \
              --name caj-assistant-migrations-certif \
              --job-execution-name "$EXECUTION_NAME" \
              --resource-group "$CERTIF_RESOURCE_GROUP" \
              --query properties.status --output tsv)"
            if [ "$STATUS" = "Succeeded" ]; then
              exit 0
            fi
            if [ "$STATUS" = "Failed" ]; then
              exit 1
            fi
            sleep 10
          done

          echo "Flyway did not finish within 10 minutes." >&2
          exit 1

      - name: Deploy CERTIF release candidate at zero replicas
        run: |
          az containerapp update \
            --name ca-assistant-api-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --image "$API_IMAGE" \
            --min-replicas 0
          az containerapp update \
            --name ca-assistant-worker-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --image "$WORKER_IMAGE" \
            --min-replicas 0
          az containerapp update \
            --name ca-assistant-spa-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --image "$SPA_IMAGE"

      - name: Verify CERTIF readiness
        run: |
          API_FQDN="$(az containerapp show \
            --name ca-assistant-api-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${API_FQDN}/health/live"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${API_FQDN}/health/ready"
