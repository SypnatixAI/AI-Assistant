name: Promote backend to CERTIF

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable DEV tag to promote, for example sha-0123...cdef
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-certif
  cancel-in-progress: false

env:
  AZURE_CORE_OUTPUT: none
  DEV_RESOURCE_GROUP: ${{ vars.AZURE_DEV_RESOURCE_GROUP }}
  CERTIF_RESOURCE_GROUP: ${{ vars.AZURE_CERTIF_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}

jobs:
  promote:
    name: Promote existing images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: certif

    steps:
      - name: Validate immutable tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^sha-[0-9a-f]{40}$'; then
            echo "image_tag must be sha- followed by the complete 40-character Git SHA." >&2
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify images and DEV provenance
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          for repository in assistant-api assistant-worker assistant-migrations; do
            az acr repository show \
              --name "$ACR_NAME" \
              --image "${repository}:${IMAGE_TAG}" \
              --only-show-errors >/dev/null
          done

          DEV_IMAGE="$(az containerapp show \
            --name ca-assistant-api-dev \
            --resource-group "$DEV_RESOURCE_GROUP" \
            --query properties.template.containers[0].image --output tsv)"
          EXPECTED_IMAGE="${ACR_NAME}.azurecr.io/assistant-api:${IMAGE_TAG}"
          if [ "$DEV_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "The requested image is not the backend revision currently validated in DEV." >&2
            exit 1
          fi

      - name: Run CERTIF Flyway job
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          LOGIN_SERVER="${ACR_NAME}.azurecr.io"
          az containerapp job update \
            --name caj-assistant-migrations-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --image "${LOGIN_SERVER}/assistant-migrations:${IMAGE_TAG}"

          EXECUTION_NAME="$(az containerapp job start \
            --name caj-assistant-migrations-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --query name --output tsv)"

          for attempt in $(seq 1 60); do
            STATUS="$(az containerapp job execution show \
              --name caj-assistant-migrations-certif \
              --job-execution-name "$EXECUTION_NAME" \
              --resource-group "$CERTIF_RESOURCE_GROUP" \
              --query properties.status --output tsv)"
            if [ "$STATUS" = "Succeeded" ]; then
              exit 0
            fi
            if [ "$STATUS" = "Failed" ]; then
              exit 1
            fi
            sleep 10
          done

          echo "Flyway did not finish within 10 minutes." >&2
          exit 1

      - name: Deploy CERTIF backend at zero replicas
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          LOGIN_SERVER="${ACR_NAME}.azurecr.io"
          az containerapp update \
            --name ca-assistant-api-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --image "${LOGIN_SERVER}/assistant-api:${IMAGE_TAG}" \
            --min-replicas 0
          az containerapp update \
            --name ca-assistant-worker-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --image "${LOGIN_SERVER}/assistant-worker:${IMAGE_TAG}" \
            --min-replicas 0

      - name: Verify CERTIF readiness
        run: |
          API_FQDN="$(az containerapp show \
            --name ca-assistant-api-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${API_FQDN}/health/live"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${API_FQDN}/health/ready"
