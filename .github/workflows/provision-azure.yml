name: Provision Azure infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Infrastructure operation to run
        required: true
        type: choice
        options:
          - bootstrap-shared
          - bootstrap-environment
          - deploy-environment
      environment_name:
        description: Used by environment operations
        required: true
        default: dev
        type: choice
        options: [dev, certif]
permissions:
  contents: read
  id-token: write

concurrency:
  group: provision-azure-${{ inputs.environment_name }}
  cancel-in-progress: false

env:
  AZURE_CORE_OUTPUT: none
  LOCATION: canadacentral
  NAME_SUFFIX: ${{ vars.AZURE_NAME_SUFFIX }}

jobs:
  provision:
    name: ${{ inputs.operation }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate naming suffix
        run: |
          if ! printf '%s' "$NAME_SUFFIX" | grep -Eq '^[a-z0-9]{3,8}$'; then
            echo "AZURE_NAME_SUFFIX must contain 3 to 8 lowercase letters or digits." >&2
            exit 1
          fi

      - name: Bootstrap shared ACR
        if: ${{ inputs.operation == 'bootstrap-shared' }}
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_SHARED_RESOURCE_GROUP }}
        run: |
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION"
          az deployment group create \
            --name "shared-${GITHUB_RUN_ID}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file deploy/infra/bootstrap-shared.bicep \
            --parameters location="$LOCATION" nameSuffix="$NAME_SUFFIX"

      - name: Select environment resource group
        if: ${{ inputs.operation != 'bootstrap-shared' }}
        run: |
          if [ "${{ inputs.environment_name }}" = "dev" ]; then
            RESOURCE_GROUP="${{ vars.AZURE_DEV_RESOURCE_GROUP }}"
          else
            RESOURCE_GROUP="${{ vars.AZURE_CERTIF_RESOURCE_GROUP }}"
          fi
          echo "RESOURCE_GROUP=${RESOURCE_GROUP}" >> "$GITHUB_ENV"

      - name: Bootstrap environment Key Vault
        if: ${{ inputs.operation == 'bootstrap-environment' }}
        run: |
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION"
          az deployment group create \
            --name "bootstrap-${{ inputs.environment_name }}-${GITHUB_RUN_ID}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file deploy/infra/bootstrap-environment.bicep \
            --parameters \
              location="$LOCATION" \
              environmentName="${{ inputs.environment_name }}" \
              nameSuffix="$NAME_SUFFIX"

          KEY_VAULT_NAME="kv-assistant-${{ inputs.environment_name }}-${NAME_SUFFIX}"
          {
            echo "### Key Vault created"
            echo
            echo "Seed the required values in \`${KEY_VAULT_NAME}\` before running deploy-environment."
            echo "The secret values must not be copied into GitHub variables or repository files."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate application image tags
        if: ${{ inputs.operation == 'deploy-environment' }}
        run: |
          API_IMAGE="$(az containerapp show \
            --name ca-assistant-api-dev \
            --resource-group "${{ vars.AZURE_DEV_RESOURCE_GROUP }}" \
            --query properties.template.containers[0].image \
            --output tsv)"
          SPA_IMAGE="$(az containerapp show \
            --name ca-assistant-spa-dev \
            --resource-group "${{ vars.AZURE_DEV_RESOURCE_GROUP }}" \
            --query properties.template.containers[0].image \
            --output tsv)"

          if ! printf '%s' "$API_IMAGE" | grep -Eq '/assistant-api:sha-[0-9a-f]{40}$'; then
            echo "The DEV API does not use a valid immutable SHA image." >&2
            exit 1
          fi
          if ! printf '%s' "$SPA_IMAGE" | grep -Eq '/assistant-spa:sha-[0-9a-f]{40}$'; then
            echo "The DEV SPA does not use a valid immutable SHA image." >&2
            exit 1
          fi

          BACKEND_TAG="${API_IMAGE##*:}"
          SPA_TAG="${SPA_IMAGE##*:}"
          echo "BACKEND_TAG=${BACKEND_TAG}" >> "$GITHUB_ENV"
          echo "SPA_TAG=${SPA_TAG}" >> "$GITHUB_ENV"

          for tag in "$BACKEND_TAG" "$SPA_TAG"; do
            if ! printf '%s' "$tag" | grep -Eq '^sha-[0-9a-f]{40}$'; then
              echo "Both image tags must be sha- followed by a complete 40-character Git SHA." >&2
              exit 1
            fi
          done

      - name: Validate SQLPad Microsoft Entra configuration
        if: ${{ inputs.operation == 'deploy-environment' }}
        env:
          SQLPAD_CLIENT_ID: ${{ vars.SQLPAD_ENTRA_CLIENT_ID }}
          SQLPAD_GROUP_ID: ${{ vars.SQLPAD_ALLOWED_GROUP_OBJECT_ID }}
        run: |
          for value in "$SQLPAD_CLIENT_ID" "$SQLPAD_GROUP_ID"; do
            if ! printf '%s' "$value" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
              echo "SQLPAD_ENTRA_CLIENT_ID and SQLPAD_ALLOWED_GROUP_OBJECT_ID must be valid GUIDs." >&2
              exit 1
            fi
          done

      - name: Preview and deploy environment
        if: ${{ inputs.operation == 'deploy-environment' }}
        env:
          SHARED_RESOURCE_GROUP: ${{ vars.AZURE_SHARED_RESOURCE_GROUP }}
        run: |
          PARAMETERS=(
            location="$LOCATION"
            environmentName="${{ inputs.environment_name }}"
            nameSuffix="$NAME_SUFFIX"
            sharedResourceGroupName="$SHARED_RESOURCE_GROUP"
            backendImageTag="$BACKEND_TAG"
            spaImageTag="$SPA_TAG"
            sqlpadEntraTenantId="${{ vars.AZURE_TENANT_ID }}"
            sqlpadEntraClientId="${{ vars.SQLPAD_ENTRA_CLIENT_ID }}"
            sqlpadAllowedGroupObjectId="${{ vars.SQLPAD_ALLOWED_GROUP_OBJECT_ID }}"
          )

          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file deploy/infra/main.bicep \
            --parameters "${PARAMETERS[@]}"

          az deployment group create \
            --name "environment-${{ inputs.environment_name }}-${GITHUB_RUN_ID}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file deploy/infra/main.bicep \
            --parameters "${PARAMETERS[@]}"
