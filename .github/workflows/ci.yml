name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Solution.sln

      - name: Build
        run: dotnet build Solution.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Solution.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Run offline RAG evaluation
        run: >-
          dotnet run --project AssistantCore.RagEvaluation/AssistantCore.RagEvaluation.csproj
          --configuration Release --no-build --
          --mode offline
          --dataset docs/recherche/rag-agentique/evaluation-cases.json
          --output artifacts/rag-evaluation

      - name: Upload RAG evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-offline
          path: artifacts/rag-evaluation
          if-no-files-found: warn
